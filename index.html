<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Login App | Supabase</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .container {
    width: 100%;
    max-width: 450px;
  }

  .card {
    background: white;
    border-radius: 20px;
    padding: 40px 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    animation: fadeIn 0.5s ease;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  h1 {
    text-align: center;
    color: #333;
    margin-bottom: 10px;
    font-size: 28px;
  }

  .subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 30px;
    font-size: 14px;
  }

  .tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 30px;
  }

  .tab {
    flex: 1;
    padding: 12px;
    border: none;
    background: #f0f0f0;
    cursor: pointer;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    transition: all 0.3s;
  }

  .tab.active {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
  }

  .form-group {
    margin-bottom: 20px;
  }

  label {
    display: block;
    margin-bottom: 8px;
    color: #333;
    font-weight: 500;
    font-size: 14px;
  }

  input {
    width: 100%;
    padding: 12px 15px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 14px;
    transition: all 0.3s;
    outline: none;
  }

  input:focus {
    border-color: #667eea;
  }

  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    font-size: 16px;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.2s;
  }

  .btn:hover {
    transform: translateY(-2px);
  }

  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .message {
    margin-top: 20px;
    padding: 12px;
    border-radius: 10px;
    text-align: center;
    font-size: 14px;
    display: none;
  }

  .message.error {
    background: #fee;
    color: #c33;
    display: block;
  }

  .message.success {
    background: #efe;
    color: #3c3;
    display: block;
  }

  .message.info {
    background: #e3f2fd;
    color: #1976d2;
    display: block;
  }

  .welcome-card {
    text-align: center;
  }

  .emoji {
    font-size: 80px;
    margin: 20px 0;
  }

  .user-info {
    background: #f5f5f5;
    padding: 15px;
    border-radius: 10px;
    margin: 20px 0;
    text-align: left;
  }

  .user-info p {
    margin: 8px 0;
    color: #333;
  }

  .logout-btn {
    background: #dc3545;
    margin-top: 20px;
  }

  .logout-btn:hover {
    background: #c82333;
  }

  .loader {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 3px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    border-top-color: white;
    animation: spin 0.6s linear infinite;
    margin-right: 8px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>

<div class="container">
  <!-- Pantalla de Login/Registro -->
  <div id="authCard" class="card">
    <h1>✨ Bienvenido</h1>
    <p class="subtitle">Gestiona tus finanzas personales</p>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Iniciar Sesión</button>
      <button class="tab" onclick="switchTab('register')">Registrarse</button>
    </div>

    <!-- Formulario de Login -->
    <div id="loginForm">
      <div class="form-group">
        <label>📧 Correo Electrónico</label>
        <input type="email" id="loginEmail" placeholder="tu@email.com">
      </div>
      <div class="form-group">
        <label>🔒 Contraseña</label>
        <input type="password" id="loginPassword" placeholder="******">
      </div>
      <button class="btn" onclick="login()">Ingresar</button>
    </div>

    <!-- Formulario de Registro -->
    <div id="registerForm" style="display:none">
      <div class="form-group">
        <label>👤 Nombre Completo</label>
        <input type="text" id="regName" placeholder="Tu nombre">
      </div>
      <div class="form-group">
        <label>📱 Teléfono</label>
        <input type="tel" id="regPhone" placeholder="+1 809 000 0000">
      </div>
      <div class="form-group">
        <label>📧 Correo Electrónico</label>
        <input type="email" id="regEmail" placeholder="tu@email.com">
      </div>
      <div class="form-group">
        <label>🔒 Contraseña</label>
        <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres">
      </div>
      <div class="form-group">
        <label>🔒 Confirmar Contraseña</label>
        <input type="password" id="regPassword2" placeholder="Repite la contraseña">
      </div>
      <button class="btn" onclick="register()">Crear Cuenta</button>
    </div>

    <div id="message" class="message"></div>
  </div>

  <!-- Pantalla de Bienvenida -->
  <div id="welcomeCard" class="card" style="display:none">
    <div class="welcome-card">
      <div class="emoji" id="welcomeEmoji">🎉</div>
      <h2 id="welcomeName">¡Hola!</h2>
      <p class="subtitle">Bienvenido a tu dashboard financiero</p>
      
      <div class="user-info">
        <p><strong>📧 Correo:</strong> <span id="userEmail"></span></p>
        <p><strong>📱 Teléfono:</strong> <span id="userPhone"></span></p>
        <p><strong>📅 Registrado:</strong> <span id="userDate"></span></p>
      </div>
      
      <button class="btn logout-btn" onclick="logout()">🚪 Cerrar Sesión</button>
    </div>
  </div>
</div>

<script>
// Configuración de Supabase
const SUPABASE_URL = 'https://jwrmekidkgeuaqfcqffq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_aBsiZbHs0N2GAuaje5B-FQ_mWDGdULj';

// Inicializar Supabase
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;

// Mostrar mensajes
function showMessage(text, type) {
  const msgDiv = document.getElementById('message');
  msgDiv.textContent = text;
  msgDiv.className = `message ${type}`;
  setTimeout(() => {
    msgDiv.className = 'message';
  }, 4000);
}

// Cambiar entre pestañas
function switchTab(tab) {
  const loginForm = document.getElementById('loginForm');
  const registerForm = document.getElementById('registerForm');
  const tabs = document.querySelectorAll('.tab');
  
  if (tab === 'login') {
    loginForm.style.display = 'block';
    registerForm.style.display = 'none';
    tabs[0].classList.add('active');
    tabs[1].classList.remove('active');
  } else {
    loginForm.style.display = 'none';
    registerForm.style.display = 'block';
    tabs[0].classList.remove('active');
    tabs[1].classList.add('active');
  }
  
  document.getElementById('message').className = 'message';
}

// Función de Login
async function login() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  
  if (!email || !password) {
    showMessage('❌ Por favor, completa todos los campos', 'error');
    return;
  }
  
  const btn = event.target;
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.innerHTML = '<span class="loader"></span> Validando...';
  
  try {
    const { data, error } = await supabase
      .from('usuarios')
      .select('*')
      .eq('correo', email)
      .eq('contrasena', password);
    
    if (error) throw error;
    
    if (!data || data.length === 0) {
      showMessage('❌ Correo o contraseña incorrectos', 'error');
    } else {
      currentUser = data[0];
      showWelcomeScreen();
      showMessage('✅ ¡Bienvenido de vuelta!', 'success');
      
      // Limpiar campos
      document.getElementById('loginEmail').value = '';
      document.getElementById('loginPassword').value = '';
    }
  } catch (error) {
    showMessage('❌ Error: ' + error.message, 'error');
  }
  
  btn.disabled = false;
  btn.textContent = originalText;
}

// Función de Registro
async function register() {
  const name = document.getElementById('regName').value.trim();
  const phone = document.getElementById('regPhone').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  const password2 = document.getElementById('regPassword2').value;
  
  if (!name || !phone || !email || !password || !password2) {
    showMessage('❌ Por favor, completa todos los campos', 'error');
    return;
  }
  
  if (password !== password2) {
    showMessage('❌ Las contraseñas no coinciden', 'error');
    return;
  }
  
  if (password.length < 6) {
    showMessage('❌ La contraseña debe tener al menos 6 caracteres', 'error');
    return;
  }
  
  const btn = event.target;
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.innerHTML = '<span class="loader"></span> Registrando...';
  
  try {
    // Verificar si el correo ya existe
    const { data: existing } = await supabase
      .from('usuarios')
      .select('correo')
      .eq('correo', email);
    
    if (existing && existing.length > 0) {
      showMessage('❌ Este correo ya está registrado', 'error');
      btn.disabled = false;
      btn.textContent = originalText;
      return;
    }
    
    // Crear nuevo usuario
    const { data, error } = await supabase
      .from('usuarios')
      .insert([{
        nombre: name,
        telefono: phone,
        correo: email,
        contrasena: password,
        created_at: new Date().toISOString()
      }])
      .select();
    
    if (error) throw error;
    
    showMessage('✅ ¡Cuenta creada exitosamente! Ahora inicia sesión', 'success');
    
    // Limpiar campos
    document.getElementById('regName').value = '';
    document.getElementById('regPhone').value = '';
    document.getElementById('regEmail').value = '';
    document.getElementById('regPassword').value = '';
    document.getElementById('regPassword2').value = '';
    
    // Cambiar a login
    setTimeout(() => switchTab('login'), 2000);
    
  } catch (error) {
    showMessage('❌ Error: ' + error.message, 'error');
  }
  
  btn.disabled = false;
  btn.textContent = originalText;
}

// Mostrar pantalla de bienvenida
function showWelcomeScreen() {
  document.getElementById('authCard').style.display = 'none';
  document.getElementById('welcomeCard').style.display = 'block';
  
  document.getElementById('welcomeName').textContent = `¡Hola ${currentUser.nombre}!`;
  document.getElementById('userEmail').textContent = currentUser.correo;
  document.getElementById('userPhone').textContent = currentUser.telefono || 'No especificado';
  
  // Formatear fecha
  const date = currentUser.created_at ? new Date(currentUser.created_at) : new Date();
  document.getElementById('userDate').textContent = date.toLocaleDateString('es-ES');
  
  // Emoji aleatorio de bienvenida
  const emojis = ['🎉', '🎊', '✨', '🌟', '💫', '⭐', '🦄', '🌈'];
  document.getElementById('welcomeEmoji').textContent = emojis[Math.floor(Math.random() * emojis.length)];
}

// Cerrar sesión
function logout() {
  currentUser = null;
  document.getElementById('authCard').style.display = 'block';
  document.getElementById('welcomeCard').style.display = 'none';
  switchTab('login');
  showMessage('👋 Has cerrado sesión', 'info');
}

// Verificar si hay sesión guardada al cargar
window.onload = () => {
  // Intentar recuperar sesión si existe
  const savedUser = sessionStorage.getItem('currentUser');
  if (savedUser) {
    try {
      currentUser = JSON.parse(savedUser);
      showWelcomeScreen();
    } catch(e) {
      console.log('Error al recuperar sesión');
    }
  }
  
  // Mostrar instrucciones para crear la tabla
  checkAndNotifyTable();
};

// Verificar y notificar sobre la tabla
async function checkAndNotifyTable() {
  try {
    const { error } = await supabase.from('usuarios').select('id', { count: 'exact', head: true });
    if (error && error.message.includes('does not exist')) {
      showMessage('ℹ️ Configuración necesaria: Ejecuta el SQL en Supabase para crear la tabla "usuarios"', 'info');
      console.log(`
      SQL para crear la tabla:
      
      CREATE TABLE usuarios (
        id SERIAL PRIMARY KEY,
        nombre TEXT NOT NULL,
        telefono TEXT NOT NULL,
        correo TEXT UNIQUE NOT NULL,
        contrasena TEXT NOT NULL,
        created_at TIMESTAMP DEFAULT NOW()
      );
      
      ALTER TABLE usuarios DISABLE ROW LEVEL SECURITY;
      `);
    }
  } catch(e) {
    console.log('Error verificando tabla');
  }
}

// Guardar sesión al hacer login
const originalLogin = login;
window.login = async function() {
  await originalLogin();
  if (currentUser) {
    sessionStorage.setItem('currentUser', JSON.stringify(currentUser));
  }
};

</script>
</body>
</html>
