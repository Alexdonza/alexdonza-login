<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Mi Sitio Web</title>
    <!-- SweetAlert2 para alertas bonitas -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 100%;
            max-width: 500px;
            transition: transform 0.3s ease;
        }

        .register-container:hover {
            transform: translateY(-5px);
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .form-group {
            padding: 20px 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group label {
            color: #555;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-register {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .btn-register:active {
            transform: translateY(0);
        }

        .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-link {
            text-align: center;
            padding: 20px 30px;
            background: #f8f9fa;
            color: #666;
            font-size: 14px;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        /* Loader spinner */
        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .form-group {
                padding: 15px 20px;
            }
            
            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="header">
            <h1>Crear Cuenta</h1>
            <p>Regístrate para acceder a todos los beneficios</p>
        </div>
        
        <div class="form-group">
            <form id="registerForm">
                <div class="input-group">
                    <label for="fullname">Nombre completo</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Juan Pérez" required>
                    <div class="error-message" id="nameError">Por favor ingresa tu nombre completo</div>
                </div>
                
                <div class="input-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                    <div class="error-message" id="emailError">Por favor ingresa un correo válido</div>
                </div>
                
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required>
                    <div class="error-message" id="passwordError">La contraseña debe tener al menos 6 caracteres</div>
                </div>
                
                <div class="input-group">
                    <label for="confirm_password">Confirmar contraseña</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Repite tu contraseña" required>
                    <div class="error-message" id="confirmError">Las contraseñas no coinciden</div>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">Acepto los <a href="#" style="color: #667eea;">Términos y Condiciones</a></label>
                </div>
                
                <button type="submit" class="btn-register" id="submitBtn">Registrarse</button>
            </form>
        </div>
        
        <div class="login-link">
            ¿Ya tienes cuenta? <a href="#">Inicia sesión aquí</a>
        </div>
    </div>

    <script>
        // Configuración de Supabase
        const SUPABASE_URL = 'https://zhuoqkegvnaxspncdjmf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_sKIijun4QqPKkKcNiSzi8Q_egOEWTy2';
        
        // Inicializar Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Variable para controlar el envío
        let isSubmitting = false;
        
        // Función para mostrar alertas con SweetAlert2
        function showAlert(icon, title, message) {
            Swal.fire({
                icon: icon,
                title: title,
                text: message,
                confirmButtonColor: '#667eea',
                confirmButtonText: 'Aceptar'
            });
        }
        
        // Función para mostrar alerta de carga
        function showLoadingAlert(message) {
            Swal.fire({
                title: message,
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading();
                }
            });
        }
        
        // Función para registrar usuario en Supabase
        async function registerUser(email, password, fullname) {
            try {
                // 1. Registrar el usuario en Supabase Auth
                const { data: authData, error: authError } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: fullname
                        }
                    }
                });
                
                if (authError) {
                    throw authError;
                }
                
                // 2. Insertar datos adicionales en la tabla 'users' (si existe)
                // Nota: Necesitarás crear esta tabla en Supabase primero
                if (authData.user) {
                    try {
                        // Intentar insertar en tabla users (opcional)
                        const { error: insertError } = await supabase
                            .from('users')
                            .insert([
                                {
                                    id: authData.user.id,
                                    email: email,
                                    full_name: fullname,
                                    created_at: new Date().toISOString()
                                }
                            ]);
                        
                        if (insertError && insertError.code !== '42P01') { // Ignorar error si la tabla no existe
                            console.warn('No se pudo insertar en tabla users:', insertError.message);
                        }
                    } catch (err) {
                        console.warn('Tabla users no disponible:', err.message);
                    }
                }
                
                return { success: true, user: authData.user };
                
            } catch (error) {
                console.error('Error en registro:', error);
                return { success: false, error: error.message };
            }
        }
        
        // Evento del formulario
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Evitar envíos múltiples
            if (isSubmitting) return;
            
            // Limpiar mensajes de error
            document.querySelectorAll('.error-message').forEach(msg => {
                msg.style.display = 'none';
            });
            
            let isValid = true;
            
            // Validar nombre
            const fullname = document.getElementById('fullname').value.trim();
            if (fullname === '') {
                document.getElementById('nameError').style.display = 'block';
                isValid = false;
            }
            
            // Validar email
            const email = document.getElementById('email').value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                document.getElementById('emailError').style.display = 'block';
                isValid = false;
            }
            
            // Validar contraseña
            const password = document.getElementById('password').value;
            if (password.length < 6) {
                document.getElementById('passwordError').style.display = 'block';
                isValid = false;
            }
            
            // Validar confirmación
            const confirmPassword = document.getElementById('confirm_password').value;
            if (password !== confirmPassword) {
                document.getElementById('confirmError').style.display = 'block';
                isValid = false;
            }
            
            // Validar términos
            const terms = document.getElementById('terms').checked;
            if (!terms) {
                showAlert('warning', 'Términos y Condiciones', 'Por favor acepta los términos y condiciones');
                isValid = false;
            }
            
            if (isValid) {
                isSubmitting = true;
                const submitBtn = document.getElementById('submitBtn');
                const originalBtnText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<span class="loader"></span> Registrando...';
                submitBtn.disabled = true;
                
                // Intentar registrar en Supabase
                const result = await registerUser(email, password, fullname);
                
                if (result.success) {
                    // Registro exitoso
                    showAlert('success', '¡Registro Exitoso!', 
                        `Bienvenido ${fullname}. Se ha enviado un correo de confirmación a ${email} (si la confirmación de email está habilitada).`);
                    
                    // Limpiar formulario
                    document.getElementById('registerForm').reset();
                    
                    // Opcional: redirigir después de 3 segundos
                    setTimeout(() => {
                        // window.location.href = '/login.html';
                    }, 3000);
                } else {
                    // Error en el registro
                    let errorMessage = result.error;
                    
                    // Mensajes de error más amigables
                    if (errorMessage.includes('User already registered')) {
                        errorMessage = 'Este correo electrónico ya está registrado. Por favor utiliza otro o inicia sesión.';
                    } else if (errorMessage.includes('password')) {
                        errorMessage = 'La contraseña no cumple con los requisitos de seguridad.';
                    } else if (errorMessage.includes('email')) {
                        errorMessage = 'El formato del correo electrónico no es válido.';
                    }
                    
                    showAlert('error', 'Error en el registro', errorMessage);
                }
                
                // Restaurar botón
                submitBtn.innerHTML = originalBtnText;
                submitBtn.disabled = false;
                isSubmitting = false;
            }
        });
        
        // Validación en tiempo real para mejorar la experiencia
        document.getElementById('confirm_password').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            if (this.value !== password && this.value !== '') {
                document.getElementById('confirmError').style.display = 'block';
            } else {
                document.getElementById('confirmError').style.display = 'none';
            }
        });
        
        document.getElementById('password').addEventListener('input', function() {
            if (this.value.length >= 6) {
                document.getElementById('passwordError').style.display = 'none';
            } else if (this.value.length > 0) {
                document.getElementById('passwordError').style.display = 'block';
            }
        });
        
        document.getElementById('email').addEventListener('input', function() {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (emailRegex.test(this.value)) {
                document.getElementById('emailError').style.display = 'none';
            }
        });
        
        document.getElementById('fullname').addEventListener('input', function() {
            if (this.value.trim() !== '') {
                document.getElementById('nameError').style.display = 'none';
            }
        });
    </script>
</body>
</html>
